services:

  fastapi:
    image: ${APP_IMAGE:-rag-ai-tutor:integration}
    container_name: rag-ai-tutor-fastapi-integration
    restart: always

    ports:
      - "8100:8000"

    env_file:
      - ../env/.env.integration

    environment:
      INNGEST_API_BASE: http://inngest:8288/v1
      INNGEST_PRODUCTION: "false"
      INNGEST_DEV: "http://inngest:8288"

    command:
      - python
      - -m
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    volumes:
      - integration_uploads:/app/uploads
      - integration_data:/app/data

    networks:
      - rag-network



  inngest:
    image: rag-ai-tutor-inngest:latest
    container_name: rag-ai-tutor-inngest-integration
    restart: always

    ports:
      - "8388:8288"

    command:
      - inngest
      - dev
      - -u
      - http://fastapi:8000/api/inngest
      - --no-discovery

    depends_on:
      fastapi:
        condition: service_started

    networks:
      - rag-network


volumes:
  integration_uploads:
  integration_data:


networks:
  rag-network:
    name: rag-ai-tutor-integration-network
    driver: bridge

